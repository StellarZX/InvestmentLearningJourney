<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="portfolioTitle">持仓记录</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="portfolio-page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ILJ</div>
      <div>
        <h1 data-i18n="portfolioTitle">持仓记录</h1>
        <p class="muted" data-i18n="portfolioSubtitle"></p>
      </div>
    </div>
    <nav class="page-nav">
      <a href="/" class="nav-link" data-i18n="navIndices">指数看板</a>
      <a href="/dca.html" class="nav-link" data-i18n="navDca">定投决策</a>
      <a href="/portfolio.html" class="nav-link active" data-i18n="navPortfolio">持仓记录</a>
      <a href="/holdings.html" class="nav-link" data-i18n="navHoldings">持仓应急</a>
    </nav>
    <div class="sidebar-note">
      <p class="muted" data-i18n="portfolioSourceNote"></p>
    </div>
  </aside>

  <main class="main">
    <section class="toolbar">
      <div>
        <p class="eyebrow" data-i18n="portfolioEyebrow">持仓与记录</p>
        <h2 id="portfolioTitle"></h2>
        <p id="portfolioCaption" class="muted"></p>
      </div>
      <div class="toolbar-actions">
        <button id="addRecordButton" type="button" data-i18n="addRecord">添加记录</button>
      </div>
    </section>

    <section id="recordForm" class="panel hidden">
      <div class="panel-header"><h3 data-i18n="addRecordTitle">添加定投记录</h3></div>
      <div class="form-grid">
        <label><span data-i18n="fFund">基金</span>
          <select id="formFund"></select>
        </label>
        <label><span data-i18n="fDate">日期</span>
          <input type="date" id="formDate">
        </label>
        <label><span data-i18n="fPosition">持仓金额（最新）</span>
          <input type="number" id="formPosition" step="0.01" min="0" placeholder="0.00">
        </label>
        <label><span data-i18n="fCost">成本（累计）</span>
          <input type="number" id="formCost" step="0.01" min="0" placeholder="0.00">
        </label>
        <label class="form-note"><span data-i18n="fNote">备注</span>
          <input type="text" id="formNote">
        </label>
      </div>
      <div class="form-actions">
        <span id="formError" class="muted"></span>
        <button id="formCancel" type="button" data-i18n="formCancel">取消</button>
        <button id="formSave" type="button" data-i18n="formSave">保存</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="currentHoldings">当前持仓</h3>
      </div>
      <div id="portfolioError" class="empty-state hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="hFund2">基金</th>
              <th data-i18n="dcaCode">代码</th>
              <th data-i18n="dcaQuota">目标</th>
              <th data-i18n="curPct">当前占比</th>
              <th data-i18n="curPosition">持仓</th>
              <th data-i18n="curCost">成本</th>
              <th data-i18n="curReturn">收益率</th>
            </tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="recordHistory">记录历史</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="fDate">日期</th>
              <th data-i18n="hFund2">基金</th>
              <th data-i18n="dcaCode">代码</th>
              <th data-i18n="curPosition">持仓</th>
              <th data-i18n="curCost">成本</th>
              <th data-i18n="fNote">备注</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/portfolio.js"></script>
</body>
</html>
