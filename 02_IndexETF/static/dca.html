<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="dcaPageTitle">每月定投分配决策</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="dca-page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ILJ</div>
      <div>
        <h1 data-i18n="dcaPageTitle">每月定投分配决策</h1>
        <p class="muted" data-i18n="dcaPageSubtitle"></p>
      </div>
    </div>
    <nav class="page-nav">
      <a href="/" class="nav-link" data-i18n="navIndices">指数看板</a>
      <a href="/dca.html" class="nav-link active" data-i18n="navDca">定投决策</a>
      <a href="/portfolio.html" class="nav-link" data-i18n="navPortfolio">持仓记录</a>
      <a href="/holdings.html" class="nav-link" data-i18n="navHoldings">持仓应急</a>
    </nav>
    <div class="sidebar-note">
      <p class="muted" data-i18n="dcaRunHint"></p>
    </div>
  </aside>

  <main class="main">
    <section class="toolbar">
      <div>
        <p class="eyebrow" data-i18n="dcaEyebrow">月度计划</p>
        <h2 id="dcaTitle"></h2>
        <p id="dcaCaption" class="muted"></p>
      </div>
      <div class="toolbar-actions">
        <label>
          <span data-i18n="dcaMonthlyTotal">月度总投入（¥）</span>
          <input type="number" id="monthlyTotalInput" min="0" step="100" value="2500" />
        </label>
        <button id="dcaRefreshButton" type="button" data-i18n="dcaRefresh">重新计算</button>
      </div>
    </section>

    <section class="panel">
      <div id="dcaError" class="empty-state hidden"></div>
      <div id="dcaGroups"></div>
      <div id="dcaNotes" class="muted dca-notes"></div>
    </section>
  </main>

  <script src="/dca.js"></script>
</body>
</html>
