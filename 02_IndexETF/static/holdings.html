<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="holdingsPageTitle">持仓应急评估</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="holdings-page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ILJ</div>
      <div>
        <h1 data-i18n="holdingsPageTitle">持仓应急评估</h1>
        <p class="muted" data-i18n="holdingsPageSubtitle"></p>
      </div>
    </div>
    <nav class="page-nav">
      <a href="/" class="nav-link" data-i18n="navIndices">指数看板</a>
      <a href="/dca.html" class="nav-link" data-i18n="navDca">定投决策</a>
      <a href="/portfolio.html" class="nav-link" data-i18n="navPortfolio">持仓记录</a>
      <a href="/holdings.html" class="nav-link active" data-i18n="navHoldings">持仓应急</a>
    </nav>
    <div class="sidebar-note">
      <p class="muted" data-i18n="holdingsSourceNote"></p>
    </div>
  </aside>

  <main class="main">
    <section class="toolbar">
      <div>
        <p class="eyebrow" data-i18n="holdingsEyebrow">应急场景</p>
        <h2 id="holdingsTitle"></h2>
        <p id="holdingsCaption" class="muted"></p>
      </div>
      <div class="toolbar-actions">
        <button id="holdingsRefreshButton" type="button" data-i18n="holdingsRefresh">重新计算</button>
      </div>
    </section>

    <section id="holdingsOverview" class="metrics-grid"></section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="holdingsTableTitle">持仓评估</h3>
        <p id="holdingsOrderCaption" class="muted"></p>
      </div>
      <div id="holdingsError" class="empty-state hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="hFund">基金</th>
              <th data-i18n="hCode">代码</th>
              <th data-i18n="hClass">角色</th>
              <th data-i18n="hPosition">持仓</th>
              <th data-i18n="hTrend">趋势</th>
              <th data-i18n="hMomentum">近6月</th>
              <th data-i18n="hDrawdown">回撤</th>
              <th data-i18n="hValuation">估值分位</th>
              <th data-i18n="hScore">卖出优先级</th>
              <th data-i18n="hTier">评级</th>
              <th data-i18n="hLiquidity">到账速度</th>
              <th data-i18n="hRecommendation">建议</th>
            </tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="holdingsOrderTitle">建议卖出顺序</h3>
        <p class="muted" data-i18n="holdingsOrderNote"></p>
      </div>
      <ol id="holdingsOrder" class="holdings-order"></ol>
      <div id="holdingsCash" class="holdings-cash"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="holdingsNotesTitle">如何解读</h3>
      </div>
      <ul id="holdingsNotes" class="holdings-notes"></ul>
      <p class="muted" id="holdingsDisclaimer"></p>
    </section>
  </main>

  <script src="/holdings.js"></script>
</body>
</html>
