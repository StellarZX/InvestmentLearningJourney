<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市场指数看板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ILJ</div>
      <div>
        <h1 data-i18n="appTitle">市场指数看板</h1>
        <p data-i18n="appSubtitle">主要全球指数，数据存储在本地数据库。</p>
      </div>
    </div>
    <nav class="page-nav">
      <a href="/" class="nav-link active" data-i18n="navIndices">指数看板</a>
      <a href="/dca.html" class="nav-link" data-i18n="navDca">定投决策</a>
      <a href="/portfolio.html" class="nav-link" data-i18n="navPortfolio">持仓记录</a>
      <a href="/holdings.html" class="nav-link" data-i18n="navHoldings">持仓应急</a>
    </nav>
  </aside>

  <main class="main">
    <section class="index-tabs" id="indexTabs" role="tablist"></section>

    <section class="toolbar">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">本地市场数据</p>
        <h2 id="selectedName" data-i18n="loading">加载中...</h2>
        <p id="selectedMeta" class="muted"></p>
      </div>
      <div class="toolbar-actions">
        <label>
          <span data-i18n="range">范围</span>
          <select id="rangeSelect">
            <option value="252" data-i18n="range1y">1年</option>
            <option value="756" data-i18n="range3y">3年</option>
            <option value="1260" selected data-i18n="range5y">5年</option>
            <option value="0" data-i18n="rangeAll">全部</option>
          </select>
        </label>
        <button id="reloadButton" type="button" data-i18n="reload">刷新</button>
      </div>
    </section>

    <section class="summary-grid" id="summaryGrid"></section>

    <section class="panel chart-panel">
      <div class="panel-header">
        <div>
          <h3 data-i18n="valuationMetrics">估值与投入评估</h3>
          <p id="valuationCaption" class="muted"></p>
        </div>
        <label>
          <span data-i18n="metric">指标</span>
          <select id="valuationMetric">
            <option value="earnings_yield" data-i18n="earningsYield">盈利收益率</option>
            <option value="pe_ttm" data-i18n="peTtm">滚动市盈率</option>
            <option value="pb" data-i18n="pb">市净率</option>
            <option value="close" data-i18n="closePrice">收盘价</option>
          </select>
        </label>
      </div>
      <div id="valuationEmpty" class="empty-state" data-i18n="valuationUnavailable">该指数暂时没有可用的评估历史数据。</div>
      <div id="investmentAdvice" class="advice-box"></div>
      <div id="valuationShell" class="split-chart-grid">
        <div class="mini-chart">
          <div class="mini-chart-title">
            <strong id="valuationChartTitle"></strong>
            <span id="valuationChartCaption" class="muted"></span>
          </div>
          <div class="chart-shell">
            <svg id="valuationChart" role="img" aria-label="Valuation metric chart"></svg>
          </div>
        </div>
        <div class="mini-chart">
          <div class="mini-chart-title">
            <strong data-i18n="assessmentScore">综合评估评分</strong>
            <span id="assessmentChartCaption" class="muted"></span>
          </div>
          <div class="chart-shell">
            <svg id="assessmentChart" role="img" aria-label="Composite assessment score chart"></svg>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="latestRecords">最新记录</h3>
        <p class="muted" data-i18n="recordsSubtitle">来自本地数据库的每日 OHLC 数据。</p>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="date">日期</th>
              <th data-i18n="open">开盘</th>
              <th data-i18n="high">最高</th>
              <th data-i18n="low">最低</th>
              <th data-i18n="close">收盘</th>
              <th data-i18n="volume">成交量</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
