<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="holdingsPageTitle">Emergency Position Review</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="holdings-page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ILJ</div>
      <div>
        <h1 data-i18n="holdingsPageTitle">Emergency Position Review</h1>
        <p class="muted" data-i18n="holdingsPageSubtitle"></p>
      </div>
    </div>
    <nav class="page-nav">
      <a href="/" class="nav-link" data-i18n="navIndices">Index Dashboard</a>
      <a href="/dca.html" class="nav-link" data-i18n="navDca">DCA Decision</a>
      <a href="/holdings.html" class="nav-link active" data-i18n="navHoldings">Emergency Review</a>
    </nav>
    <div class="sidebar-note">
      <p class="muted" data-i18n="holdingsSourceNote"></p>
    </div>
  </aside>

  <main class="main">
    <section class="toolbar">
      <div>
        <p class="eyebrow" data-i18n="holdingsEyebrow">Crash scenario</p>
        <h2 id="holdingsTitle"></h2>
        <p id="holdingsCaption" class="muted"></p>
      </div>
      <div class="toolbar-actions">
        <button id="languageButton" type="button">中文</button>
        <button id="holdingsRefreshButton" type="button" data-i18n="holdingsRefresh">Recalculate</button>
      </div>
    </section>

    <section id="holdingsOverview" class="metrics-grid"></section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="holdingsTableTitle">Position Review</h3>
        <p id="holdingsOrderCaption" class="muted"></p>
      </div>
      <div id="holdingsError" class="empty-state hidden"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="hFund">Fund</th>
              <th data-i18n="hCode">Code</th>
              <th data-i18n="hClass">Role</th>
              <th data-i18n="hPosition">Position</th>
              <th data-i18n="hTrend">Trend</th>
              <th data-i18n="hMomentum">6M</th>
              <th data-i18n="hDrawdown">Drawdown</th>
              <th data-i18n="hValuation">Valuation</th>
              <th data-i18n="hScore">Sell Score</th>
              <th data-i18n="hTier">Tier</th>
              <th data-i18n="hLiquidity">Liquidity</th>
              <th data-i18n="hRecommendation">Recommendation</th>
            </tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="holdingsOrderTitle">Suggested Sell Order</h3>
        <p class="muted" data-i18n="holdingsOrderNote"></p>
      </div>
      <ol id="holdingsOrder" class="holdings-order"></ol>
      <div id="holdingsCash" class="holdings-cash"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3 data-i18n="holdingsNotesTitle">How to read this</h3>
      </div>
      <ul id="holdingsNotes" class="holdings-notes"></ul>
      <p class="muted" id="holdingsDisclaimer"></p>
    </section>
  </main>

  <script src="/holdings.js"></script>
</body>
</html>
